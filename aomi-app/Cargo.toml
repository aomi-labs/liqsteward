[package]
name = "liqsteward-app"
version = "0.2.0"
edition = "2024"
description = "Aomi tool surface for LiqSteward vault operations and execution assurance"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aomi-sdk = "=4.0.0"
alloy-primitives = "=0.8.25"
alloy-sol-types = "=0.8.25"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
schemars = "1.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
