[package]
name = "risk-off-pilot-app"
version = "0.1.0"
edition = "2024"
description = "Aomi tool surface for independent vault incident assurance"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aomi-sdk = { path = "../../aomi-sdk/sdk" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
schemars = "1.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
